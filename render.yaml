services:
  - type: web
    name: pradeep-vegetables-backend
    env: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: BUSINESS_NAME
        value: PRADEEP FRUITS AND VEGETABLES
      - key: BUSINESS_LOCATION
        value: Bhadradri Kothagudem, Telangana, India
      - key: DEFAULT_DELIVERY_MINUTES
        value: 30
